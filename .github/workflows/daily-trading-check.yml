name: Daily trading check

on:
  schedule:
    # config/strategy_master.yaml is now crypto (v25) -- crypto trades
    # 24/7 with daily bars anchored to UTC MIDNIGHT (not a market close
    # like equities). 00:30 UTC = 30 min after the crypto day actually
    # closes, every day of the week (crypto doesn't skip weekends, so
    # neither does this -- "* * *" not "1-5"). If you switch this back
    # to config/strategy_equities_master.yaml, switch this back too --
    # see that file's own header and the equities-era git history for
    # the original "30 20 * * 1-5" (20:30 UTC, weekdays, after the 4pm
    # ET stock market close).
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      strategy_config:
        description: "Path to strategy config file"
        required: false
        default: "config/strategy_master.yaml"

jobs:
  run-live-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run live trading check
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          STRATEGY_CONFIG: ${{ inputs.strategy_config || 'config/strategy_master.yaml' }}
        run: python live/run_live.py

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: run-log
          path: live.log
          if-no-files-found: ignore
