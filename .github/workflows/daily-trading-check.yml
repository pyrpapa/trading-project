name: Daily trading check

# EXTERNAL TRIGGER ONLY (2026-09-22): the daily schedule is an external
# cron-job.org job that POSTs to this workflow's `workflow_dispatch`
# REST endpoint at 10:15 AM America/New_York (DST-aware) every weekday
# -- see https://console.cron-job.org/dashboard. GitHub's own
# `schedule:` trigger used to run alongside it as a "harmless backup"
# but was actually causing this to run twice a day, so it's been
# removed rather than left in.
#
# GitHub's native `schedule` trigger was also chronically unreliable on
# its own before cron-job.org was set up (hours-late or entirely
# missing triggers, with no error raised anywhere) -- see git history
# on this file for that saga. The root cause is architectural, not
# fixable from this repo: `schedule` events go through a separate,
# platform-wide cron-batch poller shared by every repo on GitHub, while
# `workflow_dispatch`/API-triggered runs are dispatched directly,
# bypassing that poller entirely.
#
# The cron-job.org credential (a fine-grained GitHub PAT, Actions:
# read/write only, scoped to this repo) lives in the cron-job.org
# account, not in this repo -- there is nothing to see here that
# documents it further; ask whoever set it up (see git blame on this
# comment) if it needs rotating or the account access is lost.
#
# NOTE: with `schedule:` gone, cron-job.org is the ONLY thing that
# triggers this daily -- there is no GitHub-side fallback anymore. The
# README references a daily-trading-check-watchdog.yml that would open
# an issue if no run succeeds within 20h, but as of this change that
# workflow was never actually merged (see branch claude/schedule-watchdog,
# commit aa915d7) -- a silent cron-job.org failure currently has nothing
# catching it.
on:
  workflow_dispatch:
    inputs:
      strategy_config:
        description: "Path to strategy config file"
        required: false
        default: "config/strategy_master.yaml"

jobs:
  run-live-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run live trading check
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          STRATEGY_CONFIG: ${{ inputs.strategy_config || 'config/strategy_master.yaml' }}
        # Explicit `shell: bash` runs with -o pipefail, so tee doesn't mask
        # run_live.py's exit code. -u keeps stdout/stderr interleaved in
        # order in live.log (uploaded below on failure).
        shell: bash
        run: python -u live/run_live.py 2>&1 | tee live.log

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: run-log
          path: live.log
          if-no-files-found: ignore

  # Trend + dip-buy blend (config/strategy_blend.yaml) on its OWN Alpaca
  # paper account -- runs alongside master off the same daily trigger, so
  # no second cron-job.org job is needed. Independent of the master job:
  # either can fail without stopping the other. Skips (green) until the
  # ALPACA_BLEND_* secrets exist.
  run-blend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run blend check
        env:
          ALPACA_BLEND_API_KEY: ${{ secrets.ALPACA_BLEND_API_KEY }}
          ALPACA_BLEND_SECRET_KEY: ${{ secrets.ALPACA_BLEND_SECRET_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        shell: bash
        run: |
          if [ -z "$ALPACA_BLEND_API_KEY" ]; then
            echo "ALPACA_BLEND_API_KEY secret not set -- blend not enabled yet, skipping." | tee blend.log
            exit 0
          fi
          python -u live/run_blend.py 2>&1 | tee blend.log

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: blend-log
          path: blend.log
          if-no-files-found: ignore
