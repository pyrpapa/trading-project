name: Daily trading check

on:
  schedule:
    # Runs ~5 min BEFORE the NYSE 4:00pm ET close, not after it (2026-08-20
    # change -- was "30 20 * * 1-5" = 4:30pm ET, 30 min AFTER close).
    # Running after close meant every BUY was a DAY market order submitted
    # while the market was shut: it sat "accepted" all night and only
    # filled at the NEXT day's open, 1-2.4% away from the price it was
    # sized against on a real paper trade -- an unhedged overnight gap the
    # backtest never pays (it assumes same-close fills) and the schedule
    # was needlessly exposing every single entry to. Running before close
    # instead lets the market order fill within seconds, near the same
    # close price the signal/sizing math used.
    #
    # Two cron entries because GitHub Actions cron is UTC-only and doesn't
    # know about US DST -- the "gate" step below figures out which one
    # actually lands in the 15:25-16:15 ET window and no-ops the other.
    #
    # Window widened 2026-08-21 after BOTH of that day's scheduled runs got
    # gated out (confirmed via the Actions API): GitHub delayed the correct
    # 15:55 ET trigger to 16:10 ET, which missed the original 15:50-16:05
    # window entirely -- silently zero trading checks that day. GitHub's
    # own docs say scheduled-workflow delays are commonly a few minutes but
    # can run much longer under load, and 4pm ET (market close) is a
    # popular cron target, so a 15-minute window was never going to be
    # reliably wide enough. Safe to widen past the close now that
    # risk.entry_price_guard's market-closed check independently protects
    # against a bad fill if a run does land after 16:00 -- worst case on an
    # extremely delayed day is a skipped entry (re-checked next session),
    # not a blind overnight fill.
    - cron: "55 19 * * 1-5"  # ~15:55 ET during EDT (UTC-4, roughly mid-Mar to early-Nov)
    - cron: "55 20 * * 1-5"  # ~15:55 ET during EST (UTC-5, roughly early-Nov to mid-Mar)
  workflow_dispatch:
    inputs:
      strategy_config:
        description: "Path to strategy config file"
        required: false
        default: "config/strategy_master.yaml"

jobs:
  run-live-check:
    runs-on: ubuntu-latest
    steps:
      - name: Gate on US Eastern time (skip the wrong-DST cron trigger)
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual run (workflow_dispatch) -- always proceeds."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ET_TIME=$(TZ="America/New_York" date +%H:%M)
          echo "Current US Eastern time: $ET_TIME"
          if [[ "$ET_TIME" < "15:25" || "$ET_TIME" > "16:15" ]]; then
            echo "Outside the 15:25-16:15 ET window -- this is the other DST trigger, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Run live trading check
        if: steps.gate.outputs.skip != 'true'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          STRATEGY_CONFIG: ${{ inputs.strategy_config || 'config/strategy_master.yaml' }}
        run: python live/run_live.py

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: run-log
          path: live.log
          if-no-files-found: ignore
