name: Run custom backtest

# Triggered from the dashboard's Backtest page (dashboard/api/backtest.js
# dispatches this), not meant to be run by hand from the Actions tab --
# config_yaml is a full strategy-config YAML document, already merged
# (base config + form fields + any advanced-YAML override) server-side
# before dispatch. This job just writes it to a file and runs the exact
# same run_backtest.py --save pipeline any other backtest in this
# project uses, so results land in Supabase's backtest_runs/trades
# tables identically either way.
on:
  workflow_dispatch:
    inputs:
      config_yaml:
        description: "Full strategy config, as YAML text"
        required: true
      run_label:
        description: "Label for this run"
        required: false
        default: ""

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write config file
        # Deliberately NOT `run: ... ${{ inputs.config_yaml }} ...` --
        # interpolating an untrusted/dynamic input directly into a shell
        # command is a known GitHub Actions injection risk (special
        # shell characters in the YAML could execute as commands).
        # Passing it through an env var and having Python write it
        # verbatim sidesteps shell parsing entirely.
        env:
          CONFIG_YAML: ${{ inputs.config_yaml }}
        run: python -c "import os; open('custom_backtest.yaml', 'w').write(os.environ['CONFIG_YAML'])"

      - name: Run backtest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RUN_LABEL: ${{ inputs.run_label }}
        # Same reasoning as the "Write config file" step above -- RUN_LABEL
        # flows through the environment, not shell interpolation, even
        # though it's a shorter/simpler string than config_yaml.
        run: python run_backtest.py --config custom_backtest.yaml --save --label "$RUN_LABEL"
