# CRYPTO MASTER -- the best-tested crypto config in this project,
# following the same discipline as config/strategy_master.yaml but for
# BTC-USD/ETH-USD instead of equities. NOT currently the config running
# through live/run_live.py by default -- that's still strategy_master.yaml
# (equities). This is a separate, parallel track, validated on its own
# terms, not yet promoted to "the" live config. Point --config at this
# file explicitly to run/paper-trade it.
#
# Validated across THREE separate historical windows, not just one --
# same bar every equity result in this project has had to clear:
#   2019-2024 (calm/bull)      -> 56.47%/yr, -30.22% DD  (buy-and-hold: 69.80%/yr, -76.63% to -79.35% DD)
#   2017-2019 (BTC's own crash, ~84% peak-to-trough)
#                                -> 32.28%/yr, -29.52% DD  (buy-and-hold: 94.03%/yr, -83.40% DD)
#   2020-2022 (2021 bull run -> Terra/FTX crash, ~77-78% peak-to-trough)
#                                -> 73.80%/yr, -28.19% DD  (buy-and-hold: ~110%/yr basket-equivalent, -77.44% DD)
#
# THE HEADLINE FINDING: in the 2020-2022 window specifically, this
# config beat buy-and-hold on RAW RETURN, not just risk-adjusted terms
# -- the first time that happened anywhere in this project (every
# equity and leveraged-ETF test lost to buy-and-hold on return, every
# time). When a crash is severe and prolonged enough, avoiding most of
# it preserves more capital than the cost of missing some of the
# run-up. That's a materially different, more compelling result than
# the equity side's "smoother ride, lower return" tradeoff.
#
# WHY risk_pct_per_unit is 1.5, not the default 1.0: swept 1.0-3.0
# across all three windows above. Unlike equities/leveraged ETFs (which
# had a clear inflection point where pushing further made BOTH return
# and drawdown worse), crypto's drawdown stayed relatively flat across
# this whole range in both crisis windows -- the crash risk is
# dominated by the asset's own behavior, not the sizing knob. 1.5 was
# the best or near-best point in ALL THREE windows simultaneously, not
# just one -- a genuinely multi-regime-validated choice.
#
# HONEST REMAINING GAPS, not yet closed:
#   - Only 2 assets (BTC, ETH) -- other liquid, Alpaca-tradable crypto
#     (SOL, XRP, LTC, ADA, DOGE, AVAX, LINK all confirmed tradable and
#     have sufficient history) haven't been tested as an expanded
#     portfolio yet.
#   - Only 2 historical crypto crises exist to test against at all --
#     equities have been tested across a real 2008-style crash AND
#     multiple calm windows repeatedly; crypto has two real crises,
#     both reasonably supportive, but that's a thinner evidence base
#     than what backs strategy_master.yaml.
#   - No adversarial gauntlet run yet (no momentum-rotation test, no
#     wider-stops test, no diversification-vs-concentration test) --
#     equities went through a dozen-plus rejected alternatives before
#     master_strategy.yaml was trusted; this config hasn't been
#     stress-tested against alternatives the same way.
#   - Real-world crypto trading mechanics (24/7 markets, spread,
#     Alpaca's specific crypto order handling) are unmodeled here, same
#     as every other backtest in this project.
#
# Compare against the default (1.0) sizing on the same windows:
#   python run_backtest.py --config config/strategy_v24_crypto.yaml --chart --save --label "v24-compare"
#   python run_backtest.py --config config/strategy_crypto_master.yaml --chart --save --label "crypto-master-compare"

watchlist:
  - BTC-USD
  - ETH-USD

entry:
  ma_period: 20
  volume_confirmation: true
  volume_ma_period: 20

exit:
  ma_exit: true
  type: donchian_low
  exit_breakout_period: 10
  stop_loss_pct: 8.0
  take_profit_pct: null

risk:
  sizing_method: atr_unit
  atr_period: 20
  risk_pct_per_unit: 1.5     # up from 1.0 -- see header note, validated across 3 windows
  stop_atr_multiple: 2.0
  max_position_pct: 35.0
  max_invested_pct: 80.0
  pyramiding:
    enabled: true
    unit_interval_n: 0.5
    max_units: 4

backtest:
  starting_cash: 10000
  start_date: "2019-01-01"
  end_date: "2024-12-31"
  commission_pct: 0.0
