# v38 (add GLD), windowed to 2023-2026 -- matches the refreshed
# master_strategy_crisis_2026.yaml window exactly.
#
#   python run_backtest.py --config config/strategy_master_crisis_2026.yaml --chart --save --label "master-crisis-2026-compare"
#   python run_backtest.py --config config/strategy_v38_add_gold_crisis_2026.yaml --chart --save --label "v38-add-gold-crisis-2026"

watchlist:
  - SPXL
  - TQQQ
  - SOXL
  - FAS
  - TNA
  - TECL
  - GLD

entry:
  ma_period: 20
  volume_confirmation: true
  volume_ma_period: 20

exit:
  ma_exit: true
  type: donchian_low
  exit_breakout_period: 10
  stop_loss_pct: 8.0
  take_profit_pct: null

risk:
  sizing_method: atr_unit
  atr_period: 20
  risk_pct_per_unit: 1.0
  stop_atr_multiple: 2.0
  max_position_pct: 35.0
  max_invested_pct: 80.0
  pyramiding:
    enabled: true
    unit_interval_n: 0.5
    max_units: 4
  trailing_stop:
    enabled: true
    atr_multiple: 2.0

backtest:
  starting_cash: 10000
  start_date: "2023-01-01"
  end_date: "2026-08-09"
  commission_pct: 0.0
