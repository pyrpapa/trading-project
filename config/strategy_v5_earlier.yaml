# TEST v5-earlier — same N/ATR-based sizing logic as strategy_v5_n_sizing.yaml
# (bigger-picture: v4-earlier's sizing story, replayed with N-based sizing
# instead of a flat % cap), but run against 2012-2018 instead of 2019-2024.
# Out-of-sample check: does N-based sizing's risk-adjusted improvement
# (see the 2019-2024 comparison) hold up outside the window it was first
# tested on, or was that a fit to one lucky period?

watchlist:
  - SPY
  - AAPL
  - MSFT

entry:
  ma_period: 20
  volume_confirmation: true
  volume_ma_period: 20

exit:
  # stop_loss_pct is IGNORED in atr_unit sizing mode — see risk block below.
  ma_exit: true
  stop_loss_pct: 8.0
  take_profit_pct: null

risk:
  sizing_method: atr_unit
  atr_period: 20
  risk_pct_per_unit: 1.0
  stop_atr_multiple: 2.0
  max_position_pct: 20.0
  max_invested_pct: 60.0

backtest:
  starting_cash: 10000
  start_date: "2012-01-01"
  end_date: "2018-12-31"
  commission_pct: 0.0
