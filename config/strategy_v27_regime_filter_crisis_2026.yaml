# v27, tested against 2023-2026 (recovery -> Oct 2025 ATH -> June 2026
# crash) -- the window this filter is specifically aimed at fixing. See
# strategy_master_crisis_2026.yaml for the baseline this compares against.
#   python run_backtest.py --config config/strategy_v27_regime_filter_crisis_2026.yaml --chart --save --label "v27-regime-filter-crisis-2026"

watchlist:
  - BTC-USD
  - ETH-USD
  - SOL-USD
  - XRP-USD
  - LTC-USD
  - ADA-USD
  - AVAX-USD
  - LINK-USD

entry:
  ma_period: 20
  volume_confirmation: true
  volume_ma_period: 20
  regime_filter_period: 200

exit:
  ma_exit: true
  type: donchian_low
  exit_breakout_period: 10
  stop_loss_pct: 8.0
  take_profit_pct: null

risk:
  sizing_method: atr_unit
  atr_period: 20
  risk_pct_per_unit: 1.5
  stop_atr_multiple: 2.0
  max_position_pct: 35.0
  max_invested_pct: 80.0
  pyramiding:
    enabled: true
    unit_interval_n: 0.5
    max_units: 4

backtest:
  starting_cash: 10000
  start_date: "2023-01-01"
  end_date: "2026-08-09"
  commission_pct: 0.0
