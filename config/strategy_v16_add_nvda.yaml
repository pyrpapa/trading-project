# EXPERIMENTAL v16 -- master_strategy (SPY/AAPL/MSFT, ATR-unit sizing,
# pyramiding, Donchian-low exit, 35%/80% caps) with ONE ticker added:
# NVDA. Isolates a single variable, same discipline as every other vN
# config -- v15 already showed a blanket 10-ticker sector-diverse
# expansion made things WORSE across the board (more whipsaw, diluted
# pyramiding, deeper crisis drawdown). This tests whether ONE
# genuinely-strong-trending name, picked deliberately rather than
# broadly, behaves differently.
#
# Why NVDA specifically: semiconductors/AI, a different business driver
# than AAPL (consumer hardware) or MSFT (software/cloud) despite the
# shared "tech" label -- one of the strongest secular trends of the
# 2019-2024 window. Real tradeoff: much higher volatility (bigger ATR),
# which the atr_unit sizing formula auto-compensates for (bigger N ->
# smaller position per unit for the same 1%-equity risk budget) but is
# worth watching in the results (position sizes, R-multiple spread).
#
# Compare against master_strategy on both windows:
#   python run_backtest.py --config config/strategy_master.yaml --chart --save --label "master-compare"
#   python run_backtest.py --config config/strategy_v16_add_nvda.yaml --chart --save --label "v16-add-nvda"
#   python run_backtest.py --config config/strategy_v14_looser_caps_crisis.yaml --chart --save --label "master-crisis-compare"
#   python run_backtest.py --config config/strategy_v16_add_nvda_crisis.yaml --chart --save --label "v16-add-nvda-crisis"

watchlist:
  - SPY
  - AAPL
  - MSFT
  - NVDA

entry:
  ma_period: 20
  volume_confirmation: true
  volume_ma_period: 20

exit:
  ma_exit: true
  type: donchian_low
  exit_breakout_period: 10
  stop_loss_pct: 8.0
  take_profit_pct: null

risk:
  sizing_method: atr_unit
  atr_period: 20
  risk_pct_per_unit: 1.0
  stop_atr_multiple: 2.0
  max_position_pct: 35.0
  max_invested_pct: 80.0
  pyramiding:
    enabled: true
    unit_interval_n: 0.5
    max_units: 4

backtest:
  starting_cash: 10000
  start_date: "2019-01-01"
  end_date: "2024-12-31"
  commission_pct: 0.0
