# EXPERIMENTAL v12 -- combines v10's pyramiding with v11's Donchian-low
# trend exit. Everything else is copied UNCHANGED from v5 -- same
# watchlist, same MA-crossover entry, same N/ATR-based sizing.
#
# Direct test of the open question raised by v11's real-data result
# (see PROJECT_STATUS.md #23): v11 confirmed the R-multiple ceiling was
# real (avg R 0.53R -> 0.77R, Best R 6.72R -> 8.00R vs v5) but didn't
# beat v10 (pyramiding) outright on its own -- worse SQN (3.52 vs
# 4.37), deeper max drawdown (-9.71% vs -8.53%). The question this
# config tests: does letting a PYRAMIDED stack run further before
# exiting compound the two mechanisms' benefits -- bigger bets on
# winners (pyramiding) that are also allowed to run longer before
# closing (Donchian-low exit) -- the same way pyramiding compounded
# cleanly on top of v5's plain baseline in #20? Or does combining two
# "let more risk/reward express itself" levers at once just stack
# their drawdown costs instead?
#
# Compare directly against v5, v10, and v11 on the same window:
#   python run_backtest.py --config config/strategy_v5_n_sizing.yaml --chart --save --label "v5-compare"
#   python run_backtest.py --config config/strategy_v10_pyramiding.yaml --chart --save --label "v10-compare"
#   python run_backtest.py --config config/strategy_v11_donchian_exit.yaml --chart --save --label "v11-compare"
#   python run_backtest.py --config config/strategy_v12_pyramid_donchian_exit.yaml --chart --save --label "v12-pyramid-donchian-exit"
#
# What did NOT change from v5, on purpose:
#   - entry: still MA-crossover (price closes above its own 20-day MA,
#     with volume confirmation).
#   - risk sizing settings (risk_pct_per_unit, stop_atr_multiple,
#     position caps): identical to v5/v10/v11.
#   - watchlist: identical SPY/AAPL/MSFT three tickers, identical
#     window.
#
# No new code was needed to build this -- pyramiding (backtest/engine.py)
# and exit.type (strategy/rules.py) are fully independent in the
# codebase, the same way entry.type and portfolio_selection were
# independent when v9 combined them. Sandbox-verified rather than
# assumed safe (see STRATEGY_GUIDE.md Section 16): confirmed a
# multi-unit pyramided stack still closes ALL of its units together,
# on the same date/price, when the exit trigger is a donchian_low
# signal specifically (not just the already-tested MA-crossunder or
# stop-loss paths).

watchlist:
  - SPY
  - AAPL
  - MSFT

entry:
  ma_period: 20
  volume_confirmation: true
  volume_ma_period: 20

exit:
  ma_exit: true
  type: donchian_low        # from v11
  exit_breakout_period: 10  # Turtle System 1 -- exit on a new 10-day low
  stop_loss_pct: 8.0         # ignored in atr_unit sizing mode, same as v5
  take_profit_pct: null

risk:
  sizing_method: atr_unit
  atr_period: 20
  risk_pct_per_unit: 1.0
  stop_atr_multiple: 2.0
  max_position_pct: 20.0
  max_invested_pct: 60.0
  pyramiding:                # from v10
    enabled: true
    unit_interval_n: 0.5     # add a unit every 0.5N further in your favor (Turtle default)
    max_units: 4              # cap the stack at 4 units total (Turtle default)
  # No correlation_breaker / portfolio_selection blocks -- isolating
  # this ONE new combination (pyramiding + Donchian-low exit) against
  # v5's baseline, same discipline as every other vN config.

backtest:
  starting_cash: 10000
  start_date: "2019-01-01"
  end_date: "2024-12-31"
  commission_pct: 0.0
