# v19, run against 2006-2011 -- the stress test. Nothing else changed.
#
#   python run_backtest.py --config config/strategy_v14_looser_caps_crisis.yaml --chart --save --label "master-crisis-compare"
#   python run_backtest.py --config config/strategy_v19_let_it_ride_crisis.yaml --chart --save --label "v19-let-it-ride-crisis"

watchlist:
  - SPY
  - AAPL
  - MSFT
  - NVDA

entry:
  ma_period: 20
  volume_confirmation: true
  volume_ma_period: 20

exit:
  ma_exit: true
  type: donchian_low
  exit_breakout_period: 20
  stop_loss_pct: 8.0
  take_profit_pct: null

risk:
  sizing_method: atr_unit
  atr_period: 20
  risk_pct_per_unit: 1.5
  stop_atr_multiple: 3.0
  max_position_pct: 35.0
  max_invested_pct: 80.0
  pyramiding:
    enabled: true
    unit_interval_n: 0.3
    max_units: 6

backtest:
  starting_cash: 10000
  start_date: "2006-01-01"
  end_date: "2011-12-31"
  commission_pct: 0.0
