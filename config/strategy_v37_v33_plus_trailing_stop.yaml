# v37 -- v33 (max_invested_pct:100, max_position_pct:20, ma_period:10)
# combined with the trailing stop, instead of v34's dialed-back 90%.
# Tests whether the trailing stop's drawdown protection makes the FULL
# 100% deployment viable after all, rather than needing to give some of
# it back the way v34 did -- i.e. does the trailing stop substitute for
# the cash buffer, or are they protecting against different things?
#
# Compare against v36 (v34 + trailing stop) and the live config:
#   python run_backtest.py --config config/strategy_v37_v33_plus_trailing_stop.yaml --chart --save --label "v37-v33-trailing"
#   python run_backtest.py --config config/strategy_v36_v34_plus_trailing_stop.yaml --chart --save --label "v36-compare"
#   python run_backtest.py --config config/strategy_master.yaml --chart --save --label "master-compare"

watchlist:
  - BTC-USD
  - ETH-USD
  - SOL-USD
  - XRP-USD
  - LINK-USD
  - RENDER-USD

entry:
  ma_period: 10               # v33
  volume_confirmation: true
  volume_ma_period: 20
  regime_filter_period: 150

exit:
  ma_exit: true
  type: donchian_low
  exit_breakout_period: 10
  stop_loss_pct: 8.0
  take_profit_pct: null

risk:
  sizing_method: atr_unit
  atr_period: 20
  risk_pct_per_unit: 1.5
  stop_atr_multiple: 2.0
  max_position_pct: 20.0      # v33
  max_invested_pct: 100.0     # v33 (not v34's dialed-back 90)
  pyramiding:
    enabled: true
    unit_interval_n: 0.5
    max_units: 4
  trailing_stop:
    enabled: true
    atr_multiple: 2.0

backtest:
  starting_cash: 10000
  start_date: "2019-01-01"
  end_date: "2024-12-31"
  commission_pct: 0.0
