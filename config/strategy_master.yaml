# MASTER STRATEGY -- the config intended to actually run against Alpaca
# (paper first) via live/run_live.py and the GitHub Actions daily
# schedule. Previously this was crypto (v25-v36, BTC/ETH/SOL/XRP/LINK/
# RENDER) -- that track is preserved unchanged at
# config/strategy_master_crypto_v36.yaml, still fully valid, just no
# longer the live default. This file is now 3x LEVERAGED ETFs, applying
# the exact same signal/entry/exit/sizing/pyramiding logic (originally
# config/strategy_v22_leveraged_etfs.yaml) to a wider basket than v22's
# original 3 tickers, plus the trailing stop built for crypto, ported
# here after it proved out on this asset class too.
#
# GOALPOSTS SETTLED (2026-08-17), driving every promotion decision from
# here on: more risk than plain buy-and-hold (SPY) is fine ONLY if it's
# genuinely compensated risk-adjusted (Calmar/Sortino/alpha vs SPY, all
# computed automatically by backtest/engine.py's compute_metrics for
# every real run) -- not just tolerated for a higher raw-return number.
# Personal drawdown ceiling: 15-30%, elastic upward if the system is
# demonstrably earning its keep, not a hard wall on its own. Judged over
# a 1-2 year live/paper horizon, not weeks.
#
# v40 -- TIGHTENED BOTH STOPS (2026-08-17): promoted from
# config/strategy_v40_tight_stops.yaml after a targeted parameter sweep
# (parameter_sweep.py --params risk_pct_per_unit,stop_atr_multiple,
# trailing_stop_atr_multiple,max_position_pct,max_invested_pct) run
# against all 4 standard windows specifically checking Calmar/Sortino/
# alpha-vs-SPY, not just return, per the goalposts above.
# stop_atr_multiple 2.0->1.5 and trailing_stop.atr_multiple 2.0->1.0
# EACH independently won on every metric in every window; combined, they
# compounded (same pattern as v10+v11's pyramiding+Donchian-exit combo)
# rather than just stacking or cancelling:
#   2019-2024:         215.64%/21.14%/yr/-33.63% DD/Calmar 0.629/Sortino 1.018/alpha  7.07  -> 231.44%/22.13%/yr/-28.53% DD/Calmar 0.776/Sortino 1.140/alpha 10.04
#   2020-2022 crisis:   -0.83%/-0.32%/yr/-33.63% DD/Calmar-0.008/Sortino-0.014/alpha-11.77  ->  15.55%/ 5.76%/yr/-28.53% DD/Calmar 0.202/Sortino 0.269/alpha -3.84
#   2023-2026 crisis:  108.99%/22.78%/yr/-32.50% DD/Calmar 0.701/Sortino 1.168/alpha -2.08  -> 165.02%/31.17%/yr/-29.94% DD/Calmar 1.041/Sortino 1.624/alpha  7.49
#   last-12mo:          35.55%/35.69%/yr/-21.04% DD/Calmar 1.696/Sortino 1.544/alpha -0.25  ->  50.41%/50.62%/yr/-18.82% DD/Calmar 2.690/Sortino 2.172/alpha 15.15
# Clears both goalposts above for the first time this session: every
# window's drawdown now sits inside or right at the 15-30% ceiling
# (down from -33.63% in two of four), and alpha vs SPY is positive in 3
# of 4 windows (up from positive in only 1 of 4) -- the 4th (2020-2022)
# is still negative but moved from -11.77 to -3.84, the biggest single
# improvement of any window. Turned 2020-2022 from a real loss into a
# real (if modest) gain, though it's still the weakest window by a wide
# margin -- see that window's own honest caveat below, still valid.
#
# A same-magnitude tighter GLD (unleveraged, plain gold) addition was
# also tested this session and explicitly REJECTED, not folded in here
# -- config/strategy_v38_add_gold*.yaml, config/strategy_v39_gold_capped*.yaml
# preserved for reference. Uncapped, GLD helped the two most recent
# windows but made the two older/weaker windows meaningfully worse
# (traced to its ATR-based position size running 2-4x bigger, in
# dollars, than the leveraged ETFs' -- a real, now fixable mechanism,
# see risk.ticker_overrides support added to backtest/engine.py and
# live/run_live.py this session). A 10%-capped version recovered most
# but not all of the damage while giving back real upside in the strong
# windows -- a genuine partial fix, not a clean win either way. Left out
# of master; revisit if a smarter (regime-aware, not just capped) gold
# allocation is ever built.
#
# ERX (3x ENERGY) ADDED (2026-08-17): the one candidate, out of five
# tested individually against the current 6-ticker watchlist (TMF 3x
# bonds, ERX 3x energy, YINN 3x China, CURE 3x healthcare, DRN 3x real
# estate -- all chosen specifically for having a genuinely DIFFERENT
# driver than the existing tech/financials/small-cap tilt, not just
# more leveraged equity beta), that showed a clean, broad win rather
# than a mixed tradeoff:
#   2019-2024:  231.44%/-28.53% DD/Calmar 0.776/alpha 10.04 -> 283.34%/-27.08% DD/Calmar 0.928/alpha 12.50
#   2020-2022:   15.55%/-28.53% DD/Calmar 0.202/alpha -3.84 ->  60.53%/-21.91% DD/Calmar 0.920/alpha  9.92
#   2023-2026:  165.02%/-29.94% DD/Calmar 1.041/alpha  7.49 -> 148.30%/-35.93% DD/Calmar 0.802/alpha  5.70
#   last-12mo:   50.41%/-18.82% DD/Calmar 2.690/alpha 15.15 ->  64.05%/-13.80% DD/Calmar 4.662/alpha 33.60
# Wins clearly in 3 of 4 windows, most notably 2020-2022 -- the
# project's single most persistent weak spot all session -- where alpha
# flips from -3.84 to +9.92 and Calmar more than quadruples (0.20 ->
# 0.92), the biggest improvement any single change has made to that
# window. Energy genuinely diversified against the tech-heavy basket
# during exactly the stretch that's hurt this strategy most (COVID
# recovery -> 2022, when oil/energy ran while tech-heavy leveraged ETFs
# struggled). Costs something real in 2023-2026 (drawdown -29.94% ->
# -35.93%, the one window where it's a genuine tradeoff, not a free
# win) -- not hidden here, weigh it before assuming ERX is strictly
# additive in every environment.
#
# TMF (3x bonds), the other candidate with a real theoretical
# diversification story (stocks/bonds hedge), was explicitly REJECTED:
# in 2020-2022 specifically it flipped a modest gain (+15.55%) into an
# outright LOSS (-7.17%), with Calmar/Sortino/alpha all going negative
# -- exactly the "2022 broke the classic stock/bond hedge" risk flagged
# BEFORE testing (the Fed's rate-hike cycle hurt both stocks and bonds
# together that year), confirmed rather than assumed. YINN (3x China)
# and DRN (3x real estate) were mixed -- modest help in 2020-2022, real
# costs in 2019-2024/last-12mo -- neither cleared a clean bar. CURE (3x
# healthcare) was worse in literally every metric, every window, the
# clearest reject of the five. None of the four folded in here.
#
# WHY THE PIVOT (2026-08-16): a deliberate reassessment, not a snap
# decision -- crypto's backtested headline numbers (10,000%+ in the
# best windows) turned out to be mostly BETA, not durable strategy
# skill. Every defensive lever tried this session (trailing stop,
# tighter position caps, a crypto/equity rotation overlay, a
# purpose-built choppiness filter) bought safety by giving up return,
# and the SIZE of that trade -- 13,100% down to 2,500% in the most
# protective version -- said the underlying edge was thinner than the
# raw numbers implied. The real test: crypto LOST money over the
# trailing 12 months (-15.0%), and nothing tried fixed that without
# also gutting the windows that worked. Leveraged ETFs, tested on the
# exact same trailing-12-month window, made +35.55% with healthier
# trade quality (29 trend-exits vs 16 stop-losses on the plain-equity
# version, vs crypto's 32-of-33 stop-loss pattern) -- the entry/exit
# mechanics visibly working as designed here, not fighting whipsaw.
# Crypto isn't abandoned -- config/strategy_master_crypto_v36.yaml is
# fully preserved -- it's just no longer the PRIMARY strategy. The plan
# going forward is crypto as its own separate, deliberately smaller
# allocation later, not blended into this one.
#
# WATCHLIST WIDENED FROM v22's ORIGINAL 3 (SPXL/TQQQ/SOXL) TO 6, adding
# FAS (3x financials), TNA (3x small-caps), TECL (3x tech): tested
# WITHOUT the trailing stop first and it was a clear loss (worse return
# AND worse Sortino than the 3-ticker version, on the last-12mo window)
# -- classic ticker-dilution, same lesson this project has hit
# repeatedly on the crypto side (v15's blanket expansion, DOT/UNI/BCH/
# FIL). Only WITH the trailing stop does the wider watchlist pay off:
#   last-12mo, 3 tickers, no trailing stop:  +46.06% return / -23.64% DD / Sortino 1.265
#   last-12mo, 6 tickers, no trailing stop:  +38.96% return / -26.46% DD / Sortino 1.092  (worse both ways)
#   last-12mo, 6 tickers, + trailing stop:   +35.55% return / -21.04% DD / Sortino 1.544  (best Sortino of all three)
# Chose the 6-ticker + trailing-stop version over the higher-raw-return
# 3-ticker baseline deliberately -- the 3-ticker version's return was
# concentrated almost entirely in ONE ticker (SOXL, +$2,193.70 of the
# $2,281.52 total trade P&L) -- a fragile, single-name-dependent result,
# not something to trust as the primary strategy. The wider watchlist
# is a genuine (if partial) diversification improvement, not just more
# tickers for their own sake.
#
# TRAILING STOP (backtest/engine.py's risk.trailing_stop, same
# mechanism built for and validated on crypto): ported here and
# re-validated independently on THIS asset class rather than assumed
# to transfer -- it does help, same direction as crypto (better return,
# better drawdown, better Sortino, all at once, in the last-12mo test
# above). NOT assumed for two other crypto wins tested and found NOT to
# transfer: the regime filter actually HURT here (return 2.69%->1.06%
# on the plain-equity version) and a looser exit_breakout_period also
# hurt (looser = worse here, tighter for crypto = worse there --
# genuinely different assets, don't assume a lever ports just because
# it worked once).
#
# HONEST WEAK SPOT, validated across all four standard windows before
# promoting (not just the target last-12mo window -- same discipline
# every other promotion in this project has followed). Numbers below are
# POST-v40 + POST-ERX (see above):
#   2019-2024:          283.34% total /  25.13%/yr / -27.08% DD / Sortino 1.248 / Calmar 0.928
#   2020-2022 crisis:     60.53% total /  20.15%/yr / -21.91% DD / Sortino 0.903 / Calmar 0.920
#   2023-2026 crisis:    148.30% total /  28.81%/yr / -35.93% DD / Sortino 1.533 / Calmar 0.802
#   last-12mo:             64.05% total /  64.33%/yr / -13.80% DD / Sortino 3.033 / Calmar 4.662
# 2020-2022 improved dramatically with ERX added (Calmar 0.20 -> 0.92,
# alpha -3.84 -> +9.92, see above) but 2023-2026 is now the new relative
# weak point instead (deepest drawdown of the four, -35.93%) -- adding
# ERX didn't uniformly improve every window, it shifted WHERE the
# weakness sits. Still consistent with what v22's own original header
# warned about before this was ever tested through a real crash:
# daily-reset 3x leverage compounds losses on the way down the same way
# it compounds gains on the way up, plus volatility decay during any
# choppy/sideways stretch. This is a real, known weakness, not hidden
# here -- weigh it before trusting any one window's numbers as the
# typical case.
#
# VS SIMPLE BUY-AND-HOLD (SPY, same last-12mo window): SPY alone made
# +21.99% with only -8.88% max drawdown (Calmar 2.48). This strategy's
# Calmar is now 4.662 (post-v40+ERX) -- comfortably beats SPY's, not
# just on raw return. Beta/alpha vs SPY are computed automatically for
# every real (non-synthetic) backtest run (see run_backtest.py)
# specifically so this comparison doesn't have to be redone by hand each
# time -- check them before trusting a "beat the benchmark" headline
# number, especially in windows other than last-12mo (see the HONEST
# WEAK SPOT table above -- 2020-2022's alpha is still negative).
#
# GITHUB ACTIONS SCHEDULE: switched back to equities market hours
# (weekdays, after the 4pm ET close) -- see
# .github/workflows/daily-trading-check.yml. Crypto's old 24/7,
# every-day-of-the-week schedule does NOT apply to ETFs.
#
# Compare against the preserved crypto track, and the pre-v40 tuning:
#   python run_backtest.py --config config/strategy_master_crypto_v36.yaml --chart --save --label "crypto-v36-compare"
#   python run_backtest.py --config config/strategy_v40_tight_stops.yaml --chart --save --label "v40-compare"
#   python run_backtest.py --config config/strategy_master.yaml --chart --save --label "master-compare"
#   python blend_backtest.py --chart   # ETF/crypto blend explored before this pivot, kept for reference
#
# To actually run this against Alpaca paper trading:
#   python live/run_live.py --dry-run --config config/strategy_master.yaml
#   python live/run_live.py --config config/strategy_master.yaml

watchlist:
  - SPXL
  - TQQQ
  - SOXL
  - FAS
  - TNA
  - TECL
  - ERX

entry:
  ma_period: 20
  volume_confirmation: true
  volume_ma_period: 20

exit:
  ma_exit: true
  type: donchian_low
  exit_breakout_period: 10
  stop_loss_pct: 8.0
  take_profit_pct: null

risk:
  sizing_method: atr_unit
  atr_period: 20
  risk_pct_per_unit: 1.0
  stop_atr_multiple: 1.5
  max_position_pct: 35.0
  max_invested_pct: 80.0
  pyramiding:
    enabled: true
    unit_interval_n: 0.5
    max_units: 4
  trailing_stop:
    enabled: true
    atr_multiple: 1.0

backtest:
  starting_cash: 10000
  start_date: "2019-01-01"
  end_date: "2024-12-31"
  commission_pct: 0.0
