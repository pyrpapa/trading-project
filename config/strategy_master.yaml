# MASTER STRATEGY -- the config intended to actually run against Alpaca
# (paper first) via live/run_live.py and the GitHub Actions daily
# schedule. Previously this was an equities config (SPY/AAPL/MSFT/NVDA)
# -- that track is preserved unchanged at config/strategy_equities_master.yaml,
# still fully valid, just no longer the live default. This file is now
# v25's 9-asset expanded crypto watchlist, chosen deliberately over the
# more conservative config/strategy_crypto_master.yaml (BTC/ETH only,
# -28% to -30% drawdown range) in favor of bigger backtested returns
# and more frequent trade activity, at the cost of meaningfully deeper
# drawdown (-57% to -60% range). That tradeoff was made knowingly, not
# by default -- see the comparison in the "HONEST TRADEOFFS" section
# below before assuming this is a strict upgrade over crypto_master.
#
# Validated across TWO historical crypto crises (2017-2019's ~84% BTC
# crash, 2020-2022's Terra/FTX crash) plus the calm 2019-2024 window --
# but NOT to the same depth as the equities track (a dozen-plus rejected
# alternatives tested against a real 2008-style crash). See
# config/strategy_v25_crypto_expanded.yaml and
# config/strategy_v25_crypto_expanded_crisis_2022.yaml for the full
# results this config is built from.
#
# HONEST TRADEOFFS, not just headline numbers:
#   - 2019-2024: 4847.25% total / 91.68%/yr / -57.19% DD / SQN 4.775
#   - 2020-2022 crisis: 350.97% total / 79.21%/yr / -59.85% DD / SQN 2.585
#   - The 2019-2024 return is HEAVILY concentrated: the top 3 trades
#     (out of 490) account for 57.4% of all profit; the top 10 exceed
#     100% of total profit (the other 480 trades net to roughly zero).
#     Two of the very top trades are the SAME ticker (DOGE-USD) within
#     the same few months in 2024, tied to a specific, likely
#     non-repeatable social/political catalyst -- treat the headline
#     annualized number as "what happened when a couple of outlier
#     events landed," not "the typical year to expect."
#   - Standard SQN penalizes crypto's large, dispersed UPSIDE the same
#     way it would penalize unpredictable losses -- a downside-only
#     (Sortino-style) version of the same metric actually favors crypto
#     over the equities track (39.2 vs 22.1 for crypto_master; not
#     recomputed for v25 specifically, but the same distortion applies).
#     Don't read the lower standard SQN here as "worse risk control" --
#     checked directly: downside R-multiple dispersion is nearly
#     identical to the equities track (both tightly bounded by the same
#     2N stop); the gap is entirely from bigger, more variable wins.
#
# SCHEDULING: crypto trades 24/7 with daily bars anchored to UTC
# midnight, unlike equities (anchored to the 4pm ET close). The GitHub
# Actions schedule was updated accordingly -- see
# .github/workflows/daily-trading-check.yml -- to fire after the crypto
# day actually closes, every day of the week (not just weekdays).
#
# SYMBOL FORMAT: yfinance (used for backtesting/signals) uses 'BTC-USD'
# (hyphen); Alpaca's own symbol format is 'BTC/USD' (slash) -- confirmed
# directly via the API. broker/alpaca_client.py now translates between
# the two automatically (_to_alpaca_symbol / _from_alpaca_symbol) so
# every config in this project, and this file's watchlist, stays in the
# canonical yfinance/hyphen format -- no special-casing needed here.
#
# Compare against crypto_master (the more conservative BTC/ETH-only
# choice) and the preserved equities track:
#   python run_backtest.py --config config/strategy_crypto_master.yaml --chart --save --label "crypto-master-compare"
#   python run_backtest.py --config config/strategy_equities_master.yaml --chart --save --label "equities-master-compare"
#   python run_backtest.py --config config/strategy_master.yaml --chart --save --label "master-compare"
#
# To actually run this against Alpaca paper trading:
#   python live/run_live.py --dry-run --config config/strategy_master.yaml
#   python live/run_live.py --config config/strategy_master.yaml

watchlist:
  - BTC-USD
  - ETH-USD
  - SOL-USD
  - XRP-USD
  - LTC-USD
  - ADA-USD
  - DOGE-USD
  - AVAX-USD
  - LINK-USD

entry:
  ma_period: 20
  volume_confirmation: true
  volume_ma_period: 20

exit:
  ma_exit: true
  type: donchian_low
  exit_breakout_period: 10
  stop_loss_pct: 8.0
  take_profit_pct: null

risk:
  sizing_method: atr_unit
  atr_period: 20
  risk_pct_per_unit: 1.5
  stop_atr_multiple: 2.0
  max_position_pct: 35.0
  max_invested_pct: 80.0
  pyramiding:
    enabled: true
    unit_interval_n: 0.5
    max_units: 4

backtest:
  starting_cash: 10000
  start_date: "2019-01-01"
  end_date: "2024-12-31"
  commission_pct: 0.0
