# MASTER STRATEGY -- the config intended to actually run against Alpaca
# (paper first) via live/run_live.py and the GitHub Actions daily
# schedule. Previously this was crypto (v25-v36, BTC/ETH/SOL/XRP/LINK/
# RENDER) -- that track is preserved unchanged at
# config/strategy_master_crypto_v36.yaml, still fully valid, just no
# longer the live default. This file is now 3x LEVERAGED ETFs, applying
# the exact same signal/entry/exit/sizing/pyramiding logic (originally
# config/strategy_v22_leveraged_etfs.yaml) to a wider basket than v22's
# original 3 tickers, plus the trailing stop built for crypto, ported
# here after it proved out on this asset class too.
#
# WHY THE PIVOT (2026-08-16): a deliberate reassessment, not a snap
# decision -- crypto's backtested headline numbers (10,000%+ in the
# best windows) turned out to be mostly BETA, not durable strategy
# skill. Every defensive lever tried this session (trailing stop,
# tighter position caps, a crypto/equity rotation overlay, a
# purpose-built choppiness filter) bought safety by giving up return,
# and the SIZE of that trade -- 13,100% down to 2,500% in the most
# protective version -- said the underlying edge was thinner than the
# raw numbers implied. The real test: crypto LOST money over the
# trailing 12 months (-15.0%), and nothing tried fixed that without
# also gutting the windows that worked. Leveraged ETFs, tested on the
# exact same trailing-12-month window, made +35.55% with healthier
# trade quality (29 trend-exits vs 16 stop-losses on the plain-equity
# version, vs crypto's 32-of-33 stop-loss pattern) -- the entry/exit
# mechanics visibly working as designed here, not fighting whipsaw.
# Crypto isn't abandoned -- config/strategy_master_crypto_v36.yaml is
# fully preserved -- it's just no longer the PRIMARY strategy. The plan
# going forward is crypto as its own separate, deliberately smaller
# allocation later, not blended into this one.
#
# WATCHLIST WIDENED FROM v22's ORIGINAL 3 (SPXL/TQQQ/SOXL) TO 6, adding
# FAS (3x financials), TNA (3x small-caps), TECL (3x tech): tested
# WITHOUT the trailing stop first and it was a clear loss (worse return
# AND worse Sortino than the 3-ticker version, on the last-12mo window)
# -- classic ticker-dilution, same lesson this project has hit
# repeatedly on the crypto side (v15's blanket expansion, DOT/UNI/BCH/
# FIL). Only WITH the trailing stop does the wider watchlist pay off:
#   last-12mo, 3 tickers, no trailing stop:  +46.06% return / -23.64% DD / Sortino 1.265
#   last-12mo, 6 tickers, no trailing stop:  +38.96% return / -26.46% DD / Sortino 1.092  (worse both ways)
#   last-12mo, 6 tickers, + trailing stop:   +35.55% return / -21.04% DD / Sortino 1.544  (best Sortino of all three)
# Chose the 6-ticker + trailing-stop version over the higher-raw-return
# 3-ticker baseline deliberately -- the 3-ticker version's return was
# concentrated almost entirely in ONE ticker (SOXL, +$2,193.70 of the
# $2,281.52 total trade P&L) -- a fragile, single-name-dependent result,
# not something to trust as the primary strategy. The wider watchlist
# is a genuine (if partial) diversification improvement, not just more
# tickers for their own sake.
#
# TRAILING STOP (backtest/engine.py's risk.trailing_stop, same
# mechanism built for and validated on crypto): ported here and
# re-validated independently on THIS asset class rather than assumed
# to transfer -- it does help, same direction as crypto (better return,
# better drawdown, better Sortino, all at once, in the last-12mo test
# above). NOT assumed for two other crypto wins tested and found NOT to
# transfer: the regime filter actually HURT here (return 2.69%->1.06%
# on the plain-equity version) and a looser exit_breakout_period also
# hurt (looser = worse here, tighter for crypto = worse there --
# genuinely different assets, don't assume a lever ports just because
# it worked once).
#
# HONEST WEAK SPOT, validated across all four standard windows before
# promoting (not just the target last-12mo window -- same discipline
# every other promotion in this project has followed):
#   2019-2024:          215.63% total /  21.14%/yr / -33.63% DD / Sortino 1.018 / Calmar 0.629
#   2020-2022 crisis:     -0.72% total /  -0.28%/yr / -33.63% DD / Sortino -0.012 / Calmar -0.008
#   2023-2026 crisis:    108.99% total /  22.78%/yr / -32.50% DD / Sortino 1.168 / Calmar 0.701
#   last-12mo:             35.55% total /  35.69%/yr / -21.04% DD / Sortino 1.544 / Calmar 1.696
# 2020-2022 is essentially FLAT (near-zero Sortino), despite spanning
# both the COVID recovery bull run and the 2022 crash -- consistent
# with what v22's own original header warned about before this was
# ever tested through a real crash: daily-reset 3x leverage compounds
# losses on the way down the same way it compounds gains on the way up,
# plus volatility decay during any choppy/sideways stretch. This is a
# real, known weakness, not hidden here -- weigh it before trusting the
# other three windows' numbers as the typical case.
#
# VS SIMPLE BUY-AND-HOLD (SPY, same last-12mo window): SPY alone made
# +21.99% with only -8.88% max drawdown (Calmar 2.48) -- this strategy's
# +35.55%/-21.04% (Calmar 1.696) beats SPY on raw return but takes on
# meaningfully more risk to get there. Beta/alpha vs SPY are now
# computed automatically for every real (non-synthetic) backtest run
# (see run_backtest.py) specifically so this comparison doesn't have to
# be redone by hand each time -- check them before trusting a "beat the
# benchmark" headline number.
#
# GITHUB ACTIONS SCHEDULE: switched back to equities market hours
# (weekdays, after the 4pm ET close) -- see
# .github/workflows/daily-trading-check.yml. Crypto's old 24/7,
# every-day-of-the-week schedule does NOT apply to ETFs.
#
# Compare against the preserved crypto track:
#   python run_backtest.py --config config/strategy_master_crypto_v36.yaml --chart --save --label "crypto-v36-compare"
#   python run_backtest.py --config config/strategy_master.yaml --chart --save --label "master-compare"
#   python blend_backtest.py --chart   # ETF/crypto blend explored before this pivot, kept for reference
#
# To actually run this against Alpaca paper trading:
#   python live/run_live.py --dry-run --config config/strategy_master.yaml
#   python live/run_live.py --config config/strategy_master.yaml

watchlist:
  - SPXL
  - TQQQ
  - SOXL
  - FAS
  - TNA
  - TECL

entry:
  ma_period: 20
  volume_confirmation: true
  volume_ma_period: 20

exit:
  ma_exit: true
  type: donchian_low
  exit_breakout_period: 10
  stop_loss_pct: 8.0
  take_profit_pct: null

risk:
  sizing_method: atr_unit
  atr_period: 20
  risk_pct_per_unit: 1.0
  stop_atr_multiple: 2.0
  max_position_pct: 35.0
  max_invested_pct: 80.0
  pyramiding:
    enabled: true
    unit_interval_n: 0.5
    max_units: 4
  trailing_stop:
    enabled: true
    atr_multiple: 2.0

backtest:
  starting_cash: 10000
  start_date: "2019-01-01"
  end_date: "2024-12-31"
  commission_pct: 0.0
