# v24, stress-tested against BTC's own real crash -- NOT the same
# 2006-2011 window as every equity crisis test (crypto has no data that
# far back), but a genuine, comparable crypto-specific crisis: the 2017
# bull run (BTC ~$1,000 -> ~$19,700) into the 2018 crash (~$19,700 ->
# ~$3,200, an ~84% peak-to-trough decline) and partial recovery.
#
# BTC-USD only -- ETH-USD's price history only starts 2017-11-09 (data
# checked directly before building this), too little pre-history to
# warm up cleanly within this window alongside BTC. Single-asset test,
# not a portfolio one.
#
# This is what actually answers "is crypto a direction worth trusting,
# not just a bigger number in a bull market" -- v24's 2019-2024 result
# never saw a real crypto crash at all.
#
#   python run_backtest.py --config config/strategy_v24_crypto_crisis.yaml --chart --save --label "v24-crypto-crisis"

watchlist:
  - BTC-USD

entry:
  ma_period: 20
  volume_confirmation: true
  volume_ma_period: 20

exit:
  ma_exit: true
  type: donchian_low
  exit_breakout_period: 10
  stop_loss_pct: 8.0
  take_profit_pct: null

risk:
  sizing_method: atr_unit
  atr_period: 20
  risk_pct_per_unit: 1.0
  stop_atr_multiple: 2.0
  max_position_pct: 35.0
  max_invested_pct: 80.0
  pyramiding:
    enabled: true
    unit_interval_n: 0.5
    max_units: 4

backtest:
  starting_cash: 10000
  start_date: "2017-01-01"
  end_date: "2019-12-31"
  commission_pct: 0.0
