# v26 (candidates added), stress-tested against 2020-2022 (2021 bull
# run into the Terra/FTX crash) -- same reasoning as
# strategy_v24_crypto_crisis_2022.yaml. DOT-USD only has data from
# 2020-08-20 (checked directly) -- present for most but not all of this
# window's warm-up buffer; engine.py handles a ticker with insufficient
# early history gracefully, same as every other case like this in this
# project (ETH/SOL/AVAX in earlier crisis-window tests).
#
#   python run_backtest.py --config config/strategy_master.yaml --chart --save --label "master-crisis-2022-compare-nodoge"
#   python run_backtest.py --config config/strategy_v26_crypto_candidates_crisis_2022.yaml --chart --save --label "v26-candidates-crisis-2022"

watchlist:
  - BTC-USD
  - ETH-USD
  - SOL-USD
  - XRP-USD
  - LTC-USD
  - ADA-USD
  - AVAX-USD
  - LINK-USD
  - DOT-USD
  - UNI-USD
  - BCH-USD
  - FIL-USD

entry:
  ma_period: 20
  volume_confirmation: true
  volume_ma_period: 20

exit:
  ma_exit: true
  type: donchian_low
  exit_breakout_period: 10
  stop_loss_pct: 8.0
  take_profit_pct: null

risk:
  sizing_method: atr_unit
  atr_period: 20
  risk_pct_per_unit: 1.5
  stop_atr_multiple: 2.0
  max_position_pct: 35.0
  max_invested_pct: 80.0
  pyramiding:
    enabled: true
    unit_interval_n: 0.5
    max_units: 4

backtest:
  starting_cash: 10000
  start_date: "2020-06-01"
  end_date: "2022-12-31"
  commission_pct: 0.0
