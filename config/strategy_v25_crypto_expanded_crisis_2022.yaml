# v25 (9-asset expanded crypto), stress-tested against the 2020-2022
# window (2021 bull run into the Terra/FTX crash) -- same reasoning as
# strategy_v24_crypto_crisis_2022.yaml. All 9 assets have data well
# before this window's 2020-06-01 start (checked directly), so this is
# a genuine full-portfolio crisis test, not a partial one.
#
#   python run_backtest.py --config config/strategy_v24_crypto_crisis_2022.yaml --chart --save --label "crypto-master-crisis-2022-compare"
#   python run_backtest.py --config config/strategy_v25_crypto_expanded_crisis_2022.yaml --chart --save --label "v25-crypto-expanded-crisis-2022"

watchlist:
  - BTC-USD
  - ETH-USD
  - SOL-USD
  - XRP-USD
  - LTC-USD
  - ADA-USD
  - DOGE-USD
  - AVAX-USD
  - LINK-USD

entry:
  ma_period: 20
  volume_confirmation: true
  volume_ma_period: 20

exit:
  ma_exit: true
  type: donchian_low
  exit_breakout_period: 10
  stop_loss_pct: 8.0
  take_profit_pct: null

risk:
  sizing_method: atr_unit
  atr_period: 20
  risk_pct_per_unit: 1.5
  stop_atr_multiple: 2.0
  max_position_pct: 35.0
  max_invested_pct: 80.0
  pyramiding:
    enabled: true
    unit_interval_n: 0.5
    max_units: 4

backtest:
  starting_cash: 10000
  start_date: "2020-06-01"
  end_date: "2022-12-31"
  commission_pct: 0.0
