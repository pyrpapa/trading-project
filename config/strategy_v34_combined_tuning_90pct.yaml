# v34 -- v33 with max_invested_pct dialed back from 100 to 90, testing
# whether that alone recaptures most of v33's drawdown cost while keeping
# most of its return gain. Isolated from the individual sweep
# (results/parameter-sweep/max_invested_pct.csv, max_position_pct.csv):
# max_position_pct: 20 ALONE actually improved drawdown in every window,
# it was max_invested_pct: 100 driving the increase -- see
# strategy_v33_combined_tuning.yaml's header for the full breakdown.
#
# This is the 2019-2024 window. See _crisis_2022 and _crisis_2026 sibling
# files for the other two standard windows.
#
# Compare against v33 and the live config:
#   python run_backtest.py --config config/strategy_v34_combined_tuning_90pct.yaml --chart --save --label "v34-90pct"
#   python run_backtest.py --config config/strategy_v33_combined_tuning.yaml --chart --save --label "v33-combined"
#   python run_backtest.py --config config/strategy_master.yaml --chart --save --label "master-compare"

watchlist:
  - BTC-USD
  - ETH-USD
  - SOL-USD
  - XRP-USD
  - LINK-USD
  - RENDER-USD

entry:
  ma_period: 10               # was 20 (same as v33)
  volume_confirmation: true
  volume_ma_period: 20
  regime_filter_period: 150

exit:
  ma_exit: true
  type: donchian_low
  exit_breakout_period: 10
  stop_loss_pct: 8.0
  take_profit_pct: null

risk:
  sizing_method: atr_unit
  atr_period: 20
  risk_pct_per_unit: 1.5
  stop_atr_multiple: 2.0
  max_position_pct: 20.0      # was 35.0 (same as v33)
  max_invested_pct: 90.0      # was 80.0 baseline, 100.0 in v33
  pyramiding:
    enabled: true
    unit_interval_n: 0.5
    max_units: 4

backtest:
  starting_cash: 10000
  start_date: "2019-01-01"
  end_date: "2024-12-31"
  commission_pct: 0.0
