# master_strategy.yaml (ETF strategy), windowed to the 2020-2022 crisis
# (COVID recovery bull run + the 2022 bear market).
#
watchlist:
- SPXL
- TQQQ
- SOXL
- FAS
- TNA
- TECL
- ERX
entry:
  ma_period: 20
  volume_confirmation: true
  volume_ma_period: 20
exit:
  ma_exit: true
  type: donchian_low
  exit_breakout_period: 10
  stop_loss_pct: 8.0
  take_profit_pct: null
risk:
  sizing_method: atr_unit
  atr_period: 20
  risk_pct_per_unit: 1.0
  stop_atr_multiple: 1.5
  max_position_pct: 35.0
  max_invested_pct: 80.0
  pyramiding:
    enabled: true
    unit_interval_n: 0.5
    max_units: 4
  trailing_stop:
    enabled: true
    atr_multiple: 1.0
backtest:
  starting_cash: 10000
  start_date: '2020-06-01'
  end_date: '2022-12-31'
  commission_pct: 0.0
