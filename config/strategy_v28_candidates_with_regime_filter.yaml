# EXPERIMENTAL v28 -- retest of v26 (DOT/UNI/BCH/FIL added to master's
# 8-asset base), now WITH the 200-day regime filter that v26 never had.
# v26 was rejected outright: adding these 4 diluted returns AND made
# drawdown meaningfully worse in both windows tested. The hypothesis
# here: v26's failure may have been whipsaw from the 4 new tickers, not
# a fundamental problem with the diversification itself -- the regime
# filter now screens exactly that kind of trade out. If v26 still loses
# to today's master with the SAME filter active, that's real evidence
# the additions themselves are the problem, not just whipsaw exposure.
#
#   python run_backtest.py --config config/strategy_master.yaml --chart --save --label "master-compare"
#   python run_backtest.py --config config/strategy_v28_candidates_with_regime_filter.yaml --chart --save --label "v28-candidates-regime-filter"

watchlist:
  - BTC-USD
  - ETH-USD
  - SOL-USD
  - XRP-USD
  - LTC-USD
  - ADA-USD
  - AVAX-USD
  - LINK-USD
  - DOT-USD
  - UNI-USD
  - BCH-USD
  - FIL-USD

entry:
  ma_period: 20
  volume_confirmation: true
  volume_ma_period: 20
  regime_filter_period: 200

exit:
  ma_exit: true
  type: donchian_low
  exit_breakout_period: 10
  stop_loss_pct: 8.0
  take_profit_pct: null

risk:
  sizing_method: atr_unit
  atr_period: 20
  risk_pct_per_unit: 1.5
  stop_atr_multiple: 2.0
  max_position_pct: 35.0
  max_invested_pct: 80.0
  pyramiding:
    enabled: true
    unit_interval_n: 0.5
    max_units: 4

backtest:
  starting_cash: 10000
  start_date: "2019-01-01"
  end_date: "2024-12-31"
  commission_pct: 0.0
