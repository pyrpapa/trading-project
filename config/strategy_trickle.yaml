# SLOW-TRICKLE START — same entry/exit rules as the base config, but
# total exposure hard-limited (via max_invested_pct) to ~$10,000 on a
# ~$100k paper account. Use this explicitly while you watch the first
# real paper trades happen:
#   python live/run_live.py --dry-run --config config/strategy_trickle.yaml
#   python live/run_live.py --config config/strategy_trickle.yaml
#
# Note: this is a % of live account equity, not a literal fixed dollar
# figure — it'll drift slightly with real gains/losses, staying close
# to $10k only as long as equity stays close to $100k.

watchlist:
  - SPY
  - AAPL
  - MSFT

entry:
  ma_period: 20
  volume_confirmation: true
  volume_ma_period: 20

exit:
  ma_exit: true
  stop_loss_pct: 8.0
  take_profit_pct: null

risk:
  max_position_pct: 5.0      # $5,000 per trade on a $100k account — can be half the $10k budget in one ticker, see note above
  max_invested_pct: 10.0     # $10,000 total across all positions on a $100k account

backtest:
  starting_cash: 10000
  start_date: "2019-01-01"
  end_date: "2024-12-31"
  commission_pct: 0.0
