# TEST v4-earlier — same logic as v4 (bigger position cap, same 3
# tickers) but run against 2012-2018 instead of 2019-2024. This is an
# out-of-sample test: if v4's improvement was real (not just a fit to
# one lucky period), it should still look reasonably good here too.

watchlist:
  - SPY
  - AAPL
  - MSFT

entry:
  ma_period: 20
  volume_confirmation: true
  volume_ma_period: 20

exit:
  ma_exit: true
  stop_loss_pct: 8.0
  take_profit_pct: null

risk:
  max_position_pct: 20.0
  max_invested_pct: 60.0

backtest:
  starting_cash: 10000
  start_date: "2012-01-01"
  end_date: "2018-12-31"
  commission_pct: 0.0
