# v24, stress-tested against the SECOND real crypto crash: the 2021
# bull run (BTC ~$9,000 -> ~$69,000, ETH's DeFi/NFT-driven run) into
# the 2022 crash (Terra/Luna collapse in May, FTX collapse in November)
# -- BTC fell ~78% peak-to-trough, ETH similarly severe. A genuinely
# different crypto crisis than v24-crisis's 2017-2019 window (different
# proximate causes, a more mature/institutional market by 2022, both
# BTC and ETH have full data coverage here unlike 2017-2019 where ETH's
# history was too short).
#
#   python run_backtest.py --config config/strategy_v24_crypto_crisis_2022.yaml --chart --save --label "v24-crypto-crisis-2022"

watchlist:
  - BTC-USD
  - ETH-USD

entry:
  ma_period: 20
  volume_confirmation: true
  volume_ma_period: 20

exit:
  ma_exit: true
  type: donchian_low
  exit_breakout_period: 10
  stop_loss_pct: 8.0
  take_profit_pct: null

risk:
  sizing_method: atr_unit
  atr_period: 20
  risk_pct_per_unit: 1.0
  stop_atr_multiple: 2.0
  max_position_pct: 35.0
  max_invested_pct: 80.0
  pyramiding:
    enabled: true
    unit_interval_n: 0.5
    max_units: 4

backtest:
  starting_cash: 10000
  start_date: "2020-06-01"
  end_date: "2022-12-31"
  commission_pct: 0.0
