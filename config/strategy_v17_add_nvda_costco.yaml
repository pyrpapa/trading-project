# EXPERIMENTAL v17 -- v16 (master_strategy + NVDA) with a second ticker
# added: COST (Costco). Cumulative build, same as the v10->v12 pattern
# in this project (add one thing, test, then add the next on top rather
# than testing every combination from scratch).
#
# Why COST specifically: not tech at all -- a genuine curveball against
# v15's finding. v15's blanket sector-diverse expansion (JPM/JNJ/XOM/
# CAT/PG) all whipsawed badly under this MA-crossover/Donchian-exit
# signal. Costco is a different bet: still not tech, but one of the
# cleaner, steadier long-term secular uptrends of any large-cap outside
# tech -- a test of whether "genuinely different sector" and "trends
# well under this specific signal" can coexist, rather than being
# mutually exclusive the way v15's picks turned out to be.
#
# Compare against v16 (NVDA alone) and master_strategy on both windows:
#   python run_backtest.py --config config/strategy_v16_add_nvda.yaml --chart --save --label "v16-compare"
#   python run_backtest.py --config config/strategy_v17_add_nvda_costco.yaml --chart --save --label "v17-add-nvda-costco"
#   python run_backtest.py --config config/strategy_v16_add_nvda_crisis.yaml --chart --save --label "v16-crisis-compare"
#   python run_backtest.py --config config/strategy_v17_add_nvda_costco_crisis.yaml --chart --save --label "v17-add-nvda-costco-crisis"

watchlist:
  - SPY
  - AAPL
  - MSFT
  - NVDA
  - COST

entry:
  ma_period: 20
  volume_confirmation: true
  volume_ma_period: 20

exit:
  ma_exit: true
  type: donchian_low
  exit_breakout_period: 10
  stop_loss_pct: 8.0
  take_profit_pct: null

risk:
  sizing_method: atr_unit
  atr_period: 20
  risk_pct_per_unit: 1.0
  stop_atr_multiple: 2.0
  max_position_pct: 35.0
  max_invested_pct: 80.0
  pyramiding:
    enabled: true
    unit_interval_n: 0.5
    max_units: 4

backtest:
  starting_cash: 10000
  start_date: "2019-01-01"
  end_date: "2024-12-31"
  commission_pct: 0.0
